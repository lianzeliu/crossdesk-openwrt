config crossdesk-server 'global'
	option enabled '0'
	option port '9090'
	option domain '1688.goip.de'
	option auto_fw '0'

config crossdesk-server 'ice'
	# Custom STUN servers, one full URL per line (stun:host:port).
	# These are sent to the clients as CROSSDESK_ICE_SERVERS.
	# STUN only helps hole punching; if direct connection fails you
	# still need a TURN server (see 'turn' section below).
	list stun 'stun:stun.qq.com:3478'
	list stun 'stun:stun.miwifi.com:3478'

config crossdesk-server 'turn'
	# TURN (coturn) used when direct P2P fails. Leave host empty to
	# disable. The secret is the same one configured in coturn
	# (static-auth-secret); the server derives per-client credentials
	# from it, so it must match coturn exactly.
	option host ''
	option port '3478'
	option secret ''
	# Per-client TURN credential lifetime in seconds (server default
	# 3600, allowed 60-86400).
	option credential_ttl '3600'

config crossdesk-server 'cert'
	# Certificate mode: selfsigned or letsencrypt.
	# selfsigned: generate a self-signed CA + server cert with
	#   SAN=DNS:<domain> (button in LuCI, or run
	#   /usr/libexec/crossdesk-server/cert-selfsigned.sh).
	#   Clients must trust the root cert, or use a client build
	#   that skips verification for self-hosted servers.
	# letsencrypt: issue a public Let's Encrypt certificate with
	#   acme.sh (button in LuCI, or run
	#   /usr/libexec/crossdesk-server/cert-acme.sh issue).
	#   Requires the domain to resolve to this router and port 80
	#   reachable from the internet (HTTP-01). acme.sh renews it
	#   automatically via its own cron; renewal restarts this service.
	option mode 'selfsigned'
	option acme_email ''
	# acme validation method: webroot (uhttpd serves /www) or
	# standalone (uhttpd is stopped during issuance, then restarted).
	option acme_method 'webroot'

config crossdesk-server 'advanced'
	# All values are the server's own defaults (see
	# src/signal_server.cpp and src/retention_policy.h in
	# lianzeliu/crossdesk-server). Empty values are also accepted
	# and fall back to the same defaults inside the server.
	option max_connections '8192'
	option auth_workers '2'
	option auth_timeout '600'
	option auth_queue '4096'
	option auth_source_capacity '256'
	option auth_source_per_minute '60'
	option log_retention '185'
	option offline_retention '180'
	option retention_interval '3600'
